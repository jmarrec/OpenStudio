name: Linux Buildjet arm64

on:
  push:
    branches: [ arm64 ]
    tags:
      - '*'

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  BUILD_TYPE: Release
  Python_REQUIRED_VERSION: "3.8.12"

jobs:
  linux_release:
    runs-on: buildjet-32vcpu-ubuntu-2204-arm
    permissions:
      # Needed permission to upload the release asset
      contents: write

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ env.Python_REQUIRED_VERSION }}
      id: setup-python
      # uses: actions/setup-python@v4
      # with:
      #   python-version: ${{ env.Python_REQUIRED_VERSION }}
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y build-essential libssl-dev zlib1g-dev libbz2-dev libreadline-dev libsqlite3-dev curl \
          libncursesw5-dev xz-utils tk-dev libxml2-dev libxmlsec1-dev libffi-dev liblzma-dev ninja-build

        git clone https://github.com/pyenv/pyenv.git ~/.pyenv
        export PATH=$PATH:~/.pyenv/bin
        eval "$(pyenv init -)"
        PYTHON_CONFIGURE_OPTS="--enable-shared" pyenv install ${{ env.Python_REQUIRED_VERSION }}
        echo "python-version=${{ env.Python_REQUIRED_VERSION }}" >> $GITHUB_OUTPUT
        echo "${HOME}/.pyenv/bin" >> $GITHUB_PATH
        echo "${HOME}/.pyenv/versions/$Python_REQUIRED_VERSION/bin" >> $GITHUB_PATH

#    - name: Install RVM
